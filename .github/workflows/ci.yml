# Public verification: the same commands a contributor runs locally, in the
# same order, nothing else. No secrets, no deploy steps, no caching
# cleverness — a failing test fails the check by its normal non-zero exit.
name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "gofmt needed on:" >&2
            echo "$unformatted" >&2
            exit 1
          fi
      - run: go build ./...
      - run: go vet ./...
      - run: go test -count=1 ./...
      - run: go test -race -count=1 ./...
